name: deploy
on:
  push:
    tags:
      - 'v[0-9]*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 1. 소스코드 체크아웃
        uses: actions/checkout@v7

      - name: 2. .NET 환경 세팅
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
